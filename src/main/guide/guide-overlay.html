<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      -webkit-app-region: no-drag;
    }

    /* --- Guide Speech Bubble --- */
    .guide-bubble {
      position: absolute;
      min-width: 140px;
      max-width: 280px;
      padding: 10px 14px;
      border-radius: 12px;
      font-family: -apple-system, Segoe UI, system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      transition: opacity 300ms ease, transform 300ms ease;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: auto;
      z-index: 100;
      display: none;
    }
    .guide-bubble.visible {
      opacity: 1;
      transform: translateY(0);
      display: block;
    }
    .guide-bubble.faded {
      opacity: 0.3;
    }

    /* Light theme */
    .guide-bubble.light {
      background: rgba(255, 255, 255, 0.95);
      color: #1a1a1a;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .guide-bubble.light .guide-bubble-tail {
      background: rgba(255, 255, 255, 0.95);
      border-right: 1px solid rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    /* Dark theme */
    .guide-bubble.dark {
      background: rgba(30, 30, 30, 0.92);
      color: #f0f0f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .guide-bubble.dark .guide-bubble-tail {
      background: rgba(30, 30, 30, 0.92);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .guide-bubble-caption {
      margin-bottom: 8px;
      word-wrap: break-word;
    }

    .guide-bubble-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .guide-bubble-btn {
      padding: 5px 12px;
      border-radius: 16px;
      border: none;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 100ms, opacity 150ms;
      font-family: inherit;
      pointer-events: auto;
    }
    .guide-bubble-btn:hover {
      transform: scale(1.05);
    }
    .guide-bubble-btn:active {
      transform: scale(0.95);
    }

    .guide-bubble-btn.primary {
      background: rgba(242, 169, 58, 0.18);
      color: #C7841E;
      border: 1px solid rgba(242, 169, 58, 0.35);
      box-shadow: 0 2px 6px rgba(242, 169, 58, 0.15);
    }
    .guide-bubble-btn.primary:hover {
      background: rgba(242, 169, 58, 0.28);
    }
    .guide-bubble-btn.secondary {
      background: transparent;
      color: inherit;
      border: 1px solid rgba(116, 153, 194, 0.4);
    }
    .guide-bubble-btn.cancel {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
    }

    .guide-bubble-tail {
      position: absolute;
      width: 12px;
      height: 12px;
      transform: rotate(45deg);
      z-index: -1;
    }

    /* Tail directions - point toward the owl */
    .guide-bubble.tail-left .guide-bubble-tail {
      left: -7px;
      top: 50%;
      margin-top: -6px;
    }
    .guide-bubble.tail-right .guide-bubble-tail {
      right: -7px;
      top: 50%;
      margin-top: -6px;
    }
    .guide-bubble.tail-top .guide-bubble-tail {
      top: -7px;
      left: 50%;
      margin-left: -6px;
    }
    .guide-bubble.tail-bottom .guide-bubble-tail {
      bottom: -7px;
      left: 50%;
      margin-left: -6px;
    }

    .guide-bubble-loading {
      text-align: center;
      padding: 8px 0;
      font-size: 18px;
      letter-spacing: 2px;
    }
    .guide-bubble-loading .dot {
      animation: pulse 1.2s ease-in-out infinite;
    }
    .guide-bubble-loading .dot:nth-child(2) { animation-delay: 0.2s; }
    .guide-bubble-loading .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* --- Owl (existing) --- */
    .owl {
      position: absolute;
      width: 64px;
      height: 64px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
      transition: left 500ms cubic-bezier(0.22, 1, 0.36, 1),
                  top 500ms cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 200ms ease,
                  transform 300ms ease;
      opacity: 0;
      pointer-events: auto;
      cursor: grab;
    }
    /* Directional pointers, chosen by which half of the screen the target
       is on. Defined before .owl.thinking so the thinking icon wins when
       the owl switches to thinking mode. */
    .owl.point-right { background-image: url('owl-point-right.png'); }
    .owl.point-left  { background-image: url('owl-point-left.png'); }
    .owl.visible { opacity: 0.65; }
    .owl.bob { animation: bob 1.4s ease-in-out infinite; }
    .owl.thinking {
      width: 64px;
      height: 64px;
      background: url('owl-thinking.png') no-repeat center / contain;
      animation: thinkingBob 2s ease-in-out infinite;
    }
    @keyframes thinkingBob {
      0%, 100% { transform: translateY(0) scale(1); }
      25% { transform: translateY(-6px) scale(1.05); }
      50% { transform: translateY(0) scale(1); }
      75% { transform: translateY(-3px) scale(1.02); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-4px); }
    }
    /* While dragged by the user: kill the smooth left/top transition and any
     * bob/thinking animation so the owl tracks the cursor 1:1. Declared after
     * .owl.bob / .owl.thinking so it wins equal-specificity ties. */
    .owl.dragging {
      cursor: grabbing;
      transition: none;
      animation: none;
    }
        .loading-text {
      color: #18BFE1;
      font-family: -apple-system, Segoe UI, system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* --- Capture FX: diagonal shimmer (replaces camera focus frame) ---
       A navy dim backdrop + a brand-orange sheen loop run while context is
       captured; a one-shot orange wash plays when capture completes. Right
       before the screenshot, freezeForShot() snaps the sheen to opacity 0 so
       the band never appears in the captured image (the dim stays — content
       stays readable). Tunables live in :root below. */
    :root {
      --cfx-color: 232, 148, 35;    /* brand orange #E89423 (--primary/--beak) */
      --cfx-alpha: 0.26;            /* peak sheen opacity */
      --cfx-width: 34%;             /* sheen band width (% of screen) */
      --cfx-skew: -14deg;           /* diagonal tilt */
      --cfx-period: 1.9s;           /* duration of one pass (loop) */
      --cfx-end: 0.3s;              /* duration of the one-shot end wash */
      --cfx-wash-alpha: 0.45;       /* end-wash peak opacity */
      --cfx-dim-color: 28, 37, 49;  /* navy #1c2531 backdrop tint */
      --cfx-dim-alpha: 0.25;        /* backdrop opacity (app-themed dim) */
    }

    .cfx-overlay {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      user-select: none;
      z-index: 2000;
      display: none;
    }
    .cfx-overlay.on { display: block; }

    /* Navy dim backdrop: slightly darkens the screen so the orange sheen reads
       on any window. A uniform dim is a global exposure cut, so content stays
       readable in the mid-capture screenshot. */
    .cfx-dim {
      position: absolute;
      inset: 0;
      background: rgba(var(--cfx-dim-color), var(--cfx-dim-alpha));
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    .cfx-overlay.capturing .cfx-dim,
    .cfx-overlay.finishing .cfx-dim { opacity: 1; }

    /* Frozen state (freezeForShot): sheen band forced off so the screenshot
       captures only the dim + real content — no moving band. Dim stays. */
    .cfx-overlay.frozen .cfx-sheen { animation: none !important; opacity: 0 !important; }

    /* Loop: one translucent skewed gradient band drifting across. Opacity
       envelope (0->1->1->0) softens the edges so passes feel smooth. Runs
       infinite; stops only when finish()/cancel() is called. */
    .cfx-sheen {
      position: absolute;
      top: -20%;
      bottom: -20%;
      left: 0;
      width: var(--cfx-width);
      opacity: 0;
      transform: skewX(var(--cfx-skew));
      background: linear-gradient(
        90deg,
        transparent,
        rgba(var(--cfx-color), var(--cfx-alpha)) 50%,
        transparent
      );
    }
    .cfx-overlay.capturing .cfx-sheen {
      animation: cfx-pass var(--cfx-period) ease-in-out infinite;
    }
    @keyframes cfx-pass {
      0%   { opacity: 0; transform: skewX(var(--cfx-skew)) translateX(-130%); }
      15%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; transform: skewX(var(--cfx-skew)) translateX(430%); }
    }

    /* End: one quick bright wash (the "shutter" moment), then overlay hides. */
    .cfx-wash {
      position: absolute;
      inset: 0;
      opacity: 0;
      background: rgba(var(--cfx-color), var(--cfx-wash-alpha));
    }
    .cfx-overlay.finishing .cfx-wash {
      animation: cfx-wash var(--cfx-end) ease-out both;
    }
    @keyframes cfx-wash {
      0%   { opacity: 0; }
      30%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Reduced motion: swap the sweep for a gentle pulse. */
    @media (prefers-reduced-motion: reduce) {
      .cfx-overlay.capturing .cfx-sheen {
        animation: cfx-pulse calc(var(--cfx-period) * 1.4) ease-in-out infinite;
        transform: none;
        left: 25%;
        width: 50%;
      }
      @keyframes cfx-pulse { 0%, 100% { opacity: 0; } 50% { opacity: 0.6; } }
    }
  </style>
</head>
<body>
  <div id="owl" class="owl"></div>

  <!-- Guide Speech Bubble -->
  <div id="bubble" class="guide-bubble">
    <div class="guide-bubble-tail"></div>
    <div class="guide-bubble-caption" id="bubble-caption"></div>
    <div class="guide-bubble-buttons" id="bubble-buttons"></div>
    <div class="guide-bubble-loading" id="bubble-loading" style="display:none;">
      <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
    </div>
  </div>

  <div id="cfx-overlay" class="cfx-overlay" aria-hidden="true">
    <div class="cfx-dim"></div>
    <div class="cfx-sheen"></div>
    <div class="cfx-wash"></div>
  </div>
  <script src="./guide-overlay-renderer.js"></script>
</body>
</html>
