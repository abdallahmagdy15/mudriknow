<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MudrikNow</title>
  <style>
    @font-face {
      font-family: 'Inter Variable';
      font-style: normal;
      font-display: swap;
      font-weight: 100 900;
      src: url(fonts/inter-latin-wght-normal.woff2) format('woff2-variations'),
           url(fonts/inter-latin-ext-wght-normal.woff2) format('woff2-variations');
    }

    :root {
      --accent: #d9820b;
      --accent-strong: #f5a623;
      --steel: #4e82ab;
      --ink: #132530;
      --ink-2: #5c7281;
      --line: #dde8f0;
      --card: #ffffff;
      --ok: #16a34a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Inter Variable', 'Segoe UI', system-ui, sans-serif;
      background: transparent;
      user-select: none;
    }

    .splash {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 24px;
      color: var(--ink);
      /* Site-style mesh: amber + steel soft radials over a light card. */
      background:
        radial-gradient(60% 50% at 22% 18%, rgba(245, 166, 35, 0.18), transparent 65%),
        radial-gradient(60% 60% at 82% 88%, rgba(78, 130, 171, 0.16), transparent 65%),
        radial-gradient(120% 120% at 50% 0%, rgba(245, 166, 35, 0.08) 0%, transparent 55%),
        var(--card);
      background-size: 200% 200%, 200% 200%, 100% 100%, 100% 100%;
      animation: splashAuroraShift 26s ease-in-out infinite;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(19, 37, 48, 0.16),
                  0 0 0 1px rgba(255, 255, 255, 0.5) inset;
      backdrop-filter: blur(12px);
      -webkit-app-region: no-drag;
    }

    @keyframes splashAuroraShift {
      0%, 100% { background-position: 0% 0%, 100% 100%, 50% 0%, 0 0; }
      50% { background-position: 100% 100%, 0% 0%, 50% 0%, 0 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash { animation: none; }
    }

    .owl {
      height: 88px; width: auto;
      margin-bottom: 14px;
      filter: drop-shadow(0 6px 18px rgba(78, 130, 171, 0.22));
      animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }

    .wordmark {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--ink);
      text-transform: lowercase;
      margin-bottom: 4px;
    }
    .wordmark b {
      color: var(--accent-strong);
      font-weight: 800;
    }

    .tagline {
      font-size: 12px;
      color: var(--ink-2);
      margin-bottom: 22px;
      text-align: center;
      line-height: 1.5;
    }

    .shortcuts {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .shortcut {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 7px;
      background: rgba(245, 166, 35, 0.10);
      border: 1px solid rgba(245, 166, 35, 0.28);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    }

    .shortcut .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent-strong);
      box-shadow: 0 0 6px var(--accent-strong);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ink-2);
    }

    .status .pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent-strong);
      box-shadow: 0 0 8px var(--accent-strong);
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    /* Click-to-skip hint */
    .skip-hint {
      position: absolute;
      bottom: 22px;
      font-size: 10px;
      color: rgba(92, 114, 129, 0.6);
      opacity: 0;
      animation: fadeHint 0.5s ease 1.2s forwards;
    }

    @keyframes fadeHint {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash" id="splash">
    <!-- Owl hero — static mascot.png (transparent background). -->
    <img class="owl" src="mascot.png" alt="MudrikNow owl mascot" />

    <div class="wordmark">mudrik<b>now</b></div>
    <div class="tagline" id="tagline">Running in the background. Call MudrikNow any time with a shortcut.</div>

    <div class="shortcuts" id="shortcuts">
      <span class="shortcut"><span class="dot"></span>Alt+Space</span>
      <span class="shortcut"><span class="dot"></span>Alt+X</span>
    </div>

    <div class="status">
      <span class="pulse"></span>
      <span id="status-text">Ready</span>
    </div>

    <div class="skip-hint">Click to dismiss</div>
  </div>

  <script src="./splash-renderer.js"></script>
</body>
</html>
